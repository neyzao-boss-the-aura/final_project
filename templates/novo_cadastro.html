{% extends 'base.html' %}

{% block conteudo %}

    <h1></h1>
    <div class="cabecalho-pagina">
        <div>
            <h1>Cadastro</h1>
            <p class="subtitulo">Cadastro dos funcionários</p>
        </div>
    </div>
    <p>O endpoint atual é: {{ request.endpoint }}</p>
    {% if request.endpoint == 'novo_cadastro' %}
        <section class="painel formulario">
            <h2>Novo Cadastro</h2>
            <form method="POST" action="{{ url_for('novo_cadastro') }}">
                <div class="linha-campos">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome">
                    </div>
                    <br>
                    <div class="campo">
                        <label for="data_nascimento">Data de nascimento</label>
                        <input type="date" id="data_nascimento" name="data_nascimento">
                    </div>
                    <br>
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email">
                    </div>
                    <br>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="number" id="telefone" name="telefone">
                    </div>
                    <br>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="text" id="senha" name="senha">
                    </div>
                </div>
                <br>
                    <div class="acoes-form">
                        <button type="submit" class="botao">Cadastrar</button>
                        <a href="{{ url_for('listar_cadastros') }}" class="botao botao-secundario">Cancelar</a>
                    </div>
            </form>
        </section>
    {% if not editar %}
    <a href="{{ url_for('nova_ordem_servicos') }}" class="botao">  (OS)</a>
    {% endif %}
    {% endif %}

{% endblock conteudo %}
