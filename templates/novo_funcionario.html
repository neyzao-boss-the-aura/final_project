{% extends 'base.html' %}

{% block conteudo %}
    <div class="cabecalho-pagina">
        <div>
            <h1>Funcionários</h1>
            <p class="subtitulo"></p>
        </div>
    </div>
{% if request.endpoint == 'novo_funcionario' %}
    <section class="painel formulario">
        <h2>Novo Funcionário</h2>
        <form method="POST" action="{{ url_for('novo_funcionario') }}">
            <div class="linha-campos">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">
                </div>
                <br>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <br>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone">
                </div>
                <br>
                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco">
                </div>
                <br>
                <div class="campo">
                    <label for="contratado_em">Contratado em:</label>
                    <input type="date" id="contratado_em" name="contratado_em">
                </div>
                <br>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option> Em atividade </option>
                        <option> De Férias </option>
                    </select>
                </div>
                <br>
            </div>
            <br>
                <div class="acoes-form">
                    <button type="submit" class="botao">Cadastrar </button>
                    <a href="{{ url_for('novo_funcionario') }}" class="botao botao-secundario">Cancelar</a>
                </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <a href="{{ url_for('listar_funcionarios') }}" class="botao"> Listar funcionários </a>
    {% endif %}
{% endif %}
{% endblock conteudo %}
