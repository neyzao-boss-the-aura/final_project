{% extends 'base.html' %}

{% block conteudo %}
    {% if request.endpoint == 'novo_funcionario' %}
    <section class="painel formulario">
        <div class="titulos_cadastros">
            Cadastro de Funcionário
        </div>
        <form method="POST" action="{{ url_for('novo_funcionario') }}">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">
                    <br>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                    <br>

                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone">
                    <br>

                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco">
                    <br>

                    <label for="contratado_em">Contratado em:</label>
                    <input type="date" id="contratado_em" name="contratado_em">
                    <br>

                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option> Em atividade </option>
                        <option> De Férias </option>
                    </select>
                    <br>

                    <button type="submit" class="botao_cadastros">Cadastrar </button>
                    <div class="botao3">
                        <a href="{{ url_for('novo_funcionario') }}">Cancelar</a>
                    </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <div class="botao4">
        <a href="{{ url_for('listar_funcionarios') }}"> Listar Funcionários </a>
    </div>
    {% endif %}
{% endif %}
{% endblock conteudo %}
