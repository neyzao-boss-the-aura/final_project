<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gems</title>
    <link rel="stylesheet" href="/static/final.css">
</head>
<body>

    <div class="cabecalho">
            <div class="titulo">
                <img class="image_gc" src="/static/gems.png">
                Gᴇᴍs Cᴏʀᴘ
            </div>
    </div>

    <div class="pai">
         <div class="nav">
                    <a href="{{ url_for('inicio') }}">
                    <span class="icone">🏠︎</span> Início
                    </a>

                    <a href="{{ url_for('novo_equipamento') }}">
                    <span class="icone">🛠</span> Equipamentos
                    </a>

                    <a href="{{ url_for('listar_recursos') }}">
                    <span class="icone">⏣</span> Recursos
                    </a>

                    <a href="{{ url_for('listar_ordem_servicos') }}">
                    <span class="icone">🗒</span> Ordem de Serviço
                    </a>
         </div>
    </div>

        <!-- CONTEÚDO -->
        <main class="conteudo">
            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    <div class="flash-container">
                        {% for categoria, mensagem in mensagens %}
                            <div class="flash flash-{{ categoria }}">{{ mensagem }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            {% block conteudo %}
            {% endblock %}
        </main>

</body>
</html>
