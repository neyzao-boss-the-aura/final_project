{% extends 'base.html' %}
{% block conteudo %}
<div class="cabecalho-pagina">
        <div>
            <h1>Equipamentos</h1>
        </div>
</div>
    {% if request.endpoint == 'novo_equipamento' or request.endpoint == 'editar_equipamento '%}
    <section class="painel formulario">
        <h2>Novo Equipamento</h2>
        <form method="POST" action="{{ url_for('novo_equipamento', id_equipamento=editar.id) if editar else url_for('novo_equipamento') }}">
            <div class="linha-campos">
                <div class="campo">
                    <label for="nome">Nome do equipamento</label>
                    <input type="text" id="nome" name="nome" value="{{ editar.nome if editar else ''}}>
                </div>
                <br>
                <div class="campo">
                    <label for="quantidade">Quantidade de equipamentos</label>
                    <input type="number" id="quantidade" name="quantidade" value="{{ editar.quantidade if editar else ''}}>
                </div>
                <br>
                <div class="campo">
                    <label for="nota_usuario">Nota do Usuário</label>
                    <input type="text" id="nota_usuario" name="nota_usuario" value="{{ editar.nota_usuario if editar else ''}}>
                </div>
            </div>
            <br>
                <div class="acoes-form">
                    <button type="submit" class="botao">Cadastrar</button>
                    <a href="{{ url_for('novo_equipamento') }}" class="botao botao-secundario">Cancelar</a>
                </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <a href="{{ url_for('listar_equipamentos') }}" class="botao"> Listar equipamentos </a>
    {% endif %}
    {% endif %}
{% endblock conteudo %}
