{% extends 'base.html' %}
{% block conteudo %}
<div class="cabecalho-pagina">
        <div>
            <h1>Equipamentos</h1>
            <p class="subtitulo">Cadastro dos Equipamentos</p>
        </div>
</div>
    {% if request.endpoint == 'listar_equipamentos' %}
    <section class="painel formulario">
        <h2>Novo Cadastro</h2>
        <form method="POST" action="{{ url_for('novo_equipamento') }}">
            <div class="linha-campos">
                <div class="campo">
                    <label for="nome">Nome do equipamento</label>
                    <input type="text" id="nome" name="nome">
                </div>
                <br>
                <div class="campo">
                    <label for="quantidade">Quantidade de equipamentos</label>
                    <input type="number" id="quantidade" name="quantidade">
                </div>
                <br>
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <select name="usuario">
                            {% for cadastro in cadastros %}
                            <option value="{{ cadastros.id }}">{{ cadastros.nome }}</option>
                            {% endfor %}
                    </select>
                </div>
                <br>
                <div class="campo">
                    <label for="nota_cliente">Nota do Usuário</label>
                    <input type="text" id="nota_cliente" name="nota_cliente">
                </div>
            </div>
            <br>
                <div class="acoes-form">
                    <button type="submit" class="botao">Cadastrar</button>
                    <a href="{{ url_for('novo_equipamento') }}" class="botao botao-secundario">Cancelar</a>
                </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <a href="{{ url_for('novo_equipamento') }}" class="botao"> Listar equipamentos </a>
    {% endif %}
    {% endif %}
{% endblock conteudo %}
