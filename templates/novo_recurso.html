{% extends 'base.html' %}

{% block conteudo %}
    <div class="cabecalho-pagina">
        <div>
            <h1>Recursos</h1>
            <p class="subtitulo"></p>
        </div>
    </div>
{% if request.endpoint == 'novo_recurso' %}
    <section class="painel formulario">
        <h2>Novo Recurso</h2>
        <form method="POST" action="{{ url_for('novo_recurso') }}">
            <div class="linha-campos">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">
                </div>
                <br>
                <div class="campo">
                    <label for="responsavel">Responsável</label>
                    <input type="text" id="responsavel" name="responsavel">     LISTA
                </div>
                <br>
                <div class="campo">
                    <label for="equipamento">Equipamento</label>
                    <select name="equipamento">
                            {% for equipamento in equipamentos %}
                            <option value="{{ equipamentos.id }}">{{ equipamentos.nome }}</option>
                            {% endfor %}
                    </select>
                </div>
                <br>
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" name="descricao">
                </div>
            </div>
            <br>
                <div class="acoes-form">
                    <button type="submit" class="botao">Cadastrar </button>
                    <a href="{{ url_for('novo_recurso') }}" class="botao botao-secundario">Cancelar</a>
                </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <a href="{{ url_for('listar_recursos') }}" class="botao"> Listar recursos </a>
    {% endif %}
{% endif %}
{% endblock conteudo %}
