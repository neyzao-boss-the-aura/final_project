{% extends 'base.html' %}

{% block conteudo %}
{% if request.endpoint == 'novo_recurso' %}
    <section class="painel formulario">
        <div class="titulos_cadastros">
            Cadastro de Recurso
        </div>
        <form method="POST" action="{{ url_for('novo_recurso') }}">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">
                    <br>

                    <label for="responsavel">Responsável</label>
                    <input type="text" id="responsavel" name="responsavel">
                    <br>

                    <label for="descricao">Descrição</label>
                    <textarea name="nota_usuario" id="nota_usuario" value="{{ editar.nota_usuario if editar else ''}}" rows="10" cols="30"> </textarea>
                    <br>

                    <button type="submit" class="botao_cadastros">Cadastrar </button>
                    <div class="botao3">
                       <a href="{{ url_for('novo_recurso') }}">Cancelar</a>
                    </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <div class="botao4">
        <a href="{{ url_for('listar_recursos') }}"> Listar Recursos </a>
    </div>
    {% endif %}
{% endif %}
{% endblock conteudo %}
