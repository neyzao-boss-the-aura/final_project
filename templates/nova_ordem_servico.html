{% extends 'base.html' %}

{% block conteudo %}
<div class="cabecalho-pagina">
        <div>
            <h1>Ordem de serviço</h1>
            <p class="subtitulo"></p>
        </div>
</div>

    {% if request.endpoint == 'nova_ordem_servicos' %}
    <section class="painel formulario">
        <h2>Nova Ordem de Serviço</h2>
        <form method="POST" action="{{ url_for('nova_ordem_servicos') }}">
            <div class="linha-campos">
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario">
                </div>
                <br>
                <div class="campo">
                    <label for="responsavel">Responsável</label>
                    <input type="text" id="responavel" name="responsavel">
                </div>
                <br>
                <div class="campo">
                    <label for="descricao">Equipamento</label>
                    <input type="text" id="descricao" name="descricao">
                </div>
                <br>
                <div class="campo">
                    <label for="recurso">Recurso</label>
                    <input type="text" id="recurso" name="recurso">
                </div>
                <br>
                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" name="prioridade">
                        <option> Alta </option>
                        <option> Média </option>
                        <option> Baixa </option>
                    </select>
                </div>
                <br>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option> Concluído </option>
                        <option> Em processo </option>
                        <option> Não iniciado </option>
                    </select>
                </div>
                <br>
                <div class="campo">
                    <label for="data_abertura">Início</label>
                    <input type="date" id="data_abertura" name="data_abertura">
                </div>
                <br>
                <div class="campo">
                    <label for="data_prazo">Prazo</label>
                    <input type="date" id="data_prazo" name="data_prazo">
                </div>
                <br>
                <div class="campo">
                    <label for="descricao"> Descrição </label>
                    <input type="text" id="descricao" name="descricao">
                </div>
            </div>
                <br>
                <div class="acoes-form">
                    <button type="submit" class="botao">Cadastrar</button>
                    <a href="{{ url_for('nova_ordem_servicos') }}" class="botao botao-secundario">Cancelar</a>
                </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <a href="{{ url_for('listar_ordem_servicos') }}" class="botao"> Listar ordem de serviço (OS)</a>
    {% endif %}
    {% endif %}
{% endblock conteudo %}
