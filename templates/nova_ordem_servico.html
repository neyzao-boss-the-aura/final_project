{% extends 'base.html' %}

{% block conteudo %}
    {% if request.endpoint == 'nova_ordem_servicos' %}
    <section class="painel formulario">
        <div class="titulos_cadastros">
            Cadastro de Ordem de Serviço
        </div>
        <form method="POST" action="{{ url_for('nova_ordem_servicos') }}">
                    <label for="responsavel">Responsável da OS</label>
                    <select id="responsavel" name="responsavel_id" required>
                    <option value=""> Responsável</option>
                        {% for responsavel in responsaveis %}
                            <option value="{{ responsavel.id }}">{{ responsavel.nome }}</option>
                        {% endfor %}
                    </select>
                    <br>

                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" name="prioridade">
                        <option> Baixa </option>
                        <option> Média </option>
                        <option> Alta </option>
                    </select>
                    <br>

                    <label for="estado">Status</label>
                    <select id="estado" name="estado">
                        <option> Não iniciado </option>
                        <option> Em processo </option>
                        <option> Concluído </option>
                    </select>
                    <br>

                    <label for="data_abertura"> Data de Abertura </label>
                    <input type="date" id="data_abertura" name="data_abertura">
                    <br>

                    <label for="data_prazo">Prazo</label>
                    <input type="date" id="data_prazo" name="data_prazo">
                    <br>

                    <label for="descricao"> Descrição </label>
                    <textarea name="descricao" id="descricao" value="{{ editar.descricao if editar else ''}}" rows="10" cols="30"> </textarea>
                    <br>

                    <button type="submit" class="botao_cadastros">Cadastrar</button>
                    <div class="botao3">
                        <a href="{{ url_for('nova_ordem_servicos') }}">Cancelar</a>
                    </div>
        </form>
    </section>
    <br>
    {% if not editar %}
    <div class="botao4">
        <a href="{{ url_for('listar_ordem_servicos') }}"> Listar Ordens de Serviços</a>
    </div>
    {% endif %}
    {% endif %}
{% endblock conteudo %}
